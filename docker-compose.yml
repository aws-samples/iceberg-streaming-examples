services:
  kafka:
    # Official Apache Kafka image. Kafka 4.x runs in KRaft mode only (ZooKeeper
    # has been removed), so this single node acts as both controller and broker.
    image: 'apache/kafka:4.3.1'
    hostname: kafka
    container_name: kafka
    ports:
      - '9092:9092'
    environment:
      # KRaft combined controller + broker single node
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'controller,broker'
      # A fixed cluster id keeps the formatted storage stable across restarts
      CLUSTER_ID: 'iceberg-streaming-demo-clstr'
      # Internal (docker network) listener on 9094, controller on 9093,
      # external (host) listener on 9092 so local apps use localhost:9092
      KAFKA_LISTENERS: 'CONTROLLER://:9093,PLAINTEXT://:9094,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      # More partitions => more parallelism for both producers and the Spark Kafka source.
      # 32 is a good high-throughput default for a single dev broker (matches the MSK config in
      # the README). Existing auto-created topics keep their old partition count; delete them (or
      # recreate) to pick up the new default.
      KAFKA_NUM_PARTITIONS: 32
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # --- high-throughput broker tuning ---
      KAFKA_NUM_IO_THREADS: 8
      KAFKA_NUM_NETWORK_THREADS: 5
      KAFKA_NUM_REPLICA_FETCHERS: 2
      KAFKA_BACKGROUND_THREADS: 10
      KAFKA_QUEUED_MAX_REQUESTS: 1000
      # Bigger socket buffers and request/message sizes so large batches flow without stalling.
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 104857600
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      # Store what the producer sends (zstd) without broker-side recompression.
      KAFKA_COMPRESSION_TYPE: producer
      # single broker, so internal topics must not require more than one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_MS: 1200000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 1800000
