name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
          cache: maven
      # Compiles every example and runs the JUnit tests (JobConfig parsing + CDC SQL invariants).
      # The default `emr` profile keeps Spark/Iceberg as `provided` (on the compile/test classpath).
      - name: mvn test
        run: mvn -B -ntp test

  python:
    name: PySpark lint-imports and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: uv sync
        working-directory: python
        run: uv sync
      # Runs the pytest suite: JobConfig parsing, CDC + telemetry SQL invariants, the scenario-oracle
      # model tests, and the entry-point/README parity checks that fail if a console script is
      # renamed or left undocumented.
      - name: pytest
        working-directory: python
        run: uv run pytest -q

  scenario-harness:
    name: Scenario harness (Spark + Iceberg smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: uv sync
        working-directory: python
        run: uv sync
      # End-to-end integration smoke test: seeds deterministic CDC datasets, runs them through the
      # real shared guarded MERGE against a real local Spark+Iceberg runtime (jars resolved via Ivy
      # on first run), and asserts the final table state against a pure-Python oracle. The runner
      # exits non-zero on any mismatch, so regressions in the MERGE semantics fail this job.
      - name: run all scenarios (memory source)
        working-directory: python
        run: uv run scenario all
